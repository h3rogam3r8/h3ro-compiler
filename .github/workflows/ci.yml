name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    # Both machines I actually use. Linux runs gcc, macOS runs clang, so
    # this catches the stuff that only one of them complains about.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      # HERO_WERROR only applies to my own targets, googletest is left
      # alone. Means a warning fails the build here but not on my laptop.
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DHERO_WERROR=ON

      - name: Build
        run: cmake --build build

      # ctest instead of running the binary here. This is the reason I
      # kept it around back when I added the check target.
      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Run heroc on the examples
        run: |
          for f in examples/*.hero; do
            echo "--- $f"
            ./build/tools/heroc/heroc "$f" > /dev/null
          done

      # The README roadmap is generated from which test suites pass, so if
      # it doesn't match the tests it's stale and needs regenerating.
      - name: README roadmap is up to date
        if: runner.os == 'Linux'
        run: python3 scripts/roadmap.py --check --tests ./build/tests/hero_tests

  # Separate job because the sanitizer build is slower and I don't want it
  # holding up the normal one. Catches the memory bugs the tests can't see,
  # like something outliving the SourceFile it points at.
  sanitizers:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure with asan and ubsan
        run: >
          cmake -S . -B build-san -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g"

      - name: Build
        run: cmake --build build-san

      - name: Test under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ./build-san/tests/hero_tests

      - name: Run heroc under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          for f in examples/*.hero; do
            ./build-san/tools/heroc/heroc "$f" > /dev/null
          done